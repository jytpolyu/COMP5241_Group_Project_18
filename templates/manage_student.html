{% extends "base.html" %}

{% block title %}Manage Students{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col-md-4">
            <h2>Manage Students</h2>
        </div>
        <div class="col-md-8 text-end">
            <button class="btn btn-primary" id="addStudentButton">Add Student</button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Username</th>
                        <th>GitHub Username</th>
                        <th>Role</th>
                        <th>Created At</th>
                        <th>GitHub Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- 动态填充学生信息 -->
                </tbody>
            </table>
            <nav>
                <ul class="pagination justify-content-center" id="pagination">
                    <!-- 动态填充分页按钮 -->
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Add/Edit Student Modal -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="studentModalLabel">Add/Edit Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <div class="mb-3">
                        <label for="studentId" class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="studentId" name="student_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="githubUsername" class="form-label">GitHub Username</label>
                        <input type="text" class="form-control" id="githubUsername" name="github_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <input type="text" class="form-control" id="role" name="role" required>
                    </div>
                    <input type="hidden" id="currentCourseId" name="current_course_id">
                    <div class="mb-3">
                        <label for="githubEmail" class="form-label">GitHub Email</label>
                        <input type="email" class="form-control" id="githubEmail" name="github_email" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Delete Student Modal -->
<div class="modal fade" id="deleteStudentModal" tabindex="-1" aria-labelledby="deleteStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteStudentModalLabel">Delete Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this student?</p>
                <button type="button" class="btn btn-danger" id="confirmDeleteButton">Delete</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        function loadStudents(page = 1) {
            fetch(`/get_students?page=${page}`)
                .then(response => response.json())
                .then(data => {
                    var studentTableBody = document.getElementById('studentTableBody');
                    studentTableBody.innerHTML = '';
                    data.students.forEach(student => {
                        var row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${student.student_id}</td>
                            <td>${student.username}</td>
                            <td>${student.github_username}</td>
                            <td>${student.role}</td>
                            <td>${student.created_at}</td>
                            <td>${student.github_email}</td>
                            <td>
                                <button class="btn btn-warning btn-sm editStudentButton" data-student-id="${student.student_id}">Edit</button>
                                <button class="btn btn-danger btn-sm deleteStudentButton" data-student-id="${student.student_id}">Delete</button>
                            </td>
                        `;
                        studentTableBody.appendChild(row);
                    });

                    document.querySelectorAll('.editStudentButton').forEach(button => {
                        button.addEventListener('click', function() {
                            var studentId = this.getAttribute('data-student-id');
                            editStudent(studentId);
                        });
                    });

                    document.querySelectorAll('.deleteStudentButton').forEach(button => {
                        button.addEventListener('click', function() {
                            var studentId = this.getAttribute('data-student-id');
                            deleteStudent(studentId);
                        });
                    });

                    var pagination = document.getElementById('pagination');
                    pagination.innerHTML = '';
                    var totalPages = Math.ceil(data.total / data.per_page);
                    for (var i = 1; i <= totalPages; i++) {
                        var li = document.createElement('li');
                        li.className = 'page-item' + (i === data.page ? ' active' : '');
                        li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                        li.addEventListener('click', function(event) {
                            event.preventDefault();
                            loadStudents(parseInt(this.textContent));
                        });
                        pagination.appendChild(li);
                    }
                });
        }

        function editStudent(studentId) {
            fetch(`/get_student/${studentId}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('studentId').value = data.student.student_id;
                    document.getElementById('username').value = data.student.username;
                    document.getElementById('githubUsername').value = data.student.github_username;
                    document.getElementById('role').value = data.student.role;
                    document.getElementById('currentCourseId').value = data.student.current_course_id;
                    document.getElementById('githubEmail').value = data.student.github_email;
                    document.getElementById('studentModalLabel').textContent = 'Edit Student';
                    new bootstrap.Modal(document.getElementById('studentModal')).show();
                });
        }

        function deleteStudent(studentId) {
            document.getElementById('confirmDeleteButton').setAttribute('data-student-id', studentId);
            new bootstrap.Modal(document.getElementById('deleteStudentModal')).show();
        }

        document.getElementById('confirmDeleteButton').addEventListener('click', function() {
            var studentId = this.getAttribute('data-student-id');
            fetch(`/delete_student/${studentId}`, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok) {
                    alert('Student deleted successfully.');
                    loadStudents();
                    var deleteStudentModal = bootstrap.Modal.getInstance(document.getElementById('deleteStudentModal'));
                    deleteStudentModal.hide();
                } else {
                    alert('Failed to delete student.');
                }
            });
        });

        document.getElementById('addStudentButton').addEventListener('click', function() {
            document.getElementById('studentForm').reset();
            document.getElementById('studentModalLabel').textContent = 'Add Student';
            new bootstrap.Modal(document.getElementById('studentModal')).show();
        });

        document.getElementById('studentForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var formData = new FormData(this);
            var studentData = {};
            formData.forEach((value, key) => {
                studentData[key] = value;
            });
            var url = document.getElementById('studentModalLabel').textContent === 'Add Student' ? '/add_student' : `/update_student/${studentData.student_id}`;
            var method = document.getElementById('studentModalLabel').textContent === 'Add Student' ? 'POST' : 'PUT';
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            }).then(response => {
                if (response.ok) {
                    alert('Student saved successfully.');
                    loadStudents();
                    var studentModal = bootstrap.Modal.getInstance(document.getElementById('studentModal'));
                    studentModal.hide();
                } else {
                    alert('Failed to save student.');
                }
            });
        });

        // Load initial data
        loadStudents();
    });
</script>
{% endblock %}
