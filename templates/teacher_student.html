{% extends "base.html" %}

{% block title %}Student Stats{% endblock %}

{% block content %}
<h3>Student Stats</h3>
<div class="row mb-3">
    <div class="col-md-4">
        <input type="text" id="searchInput" class="form-control" placeholder="Enter Student ID to search">
    </div>
    <div class="col-md-4">
        <select id="activityTypeSelect" class="form-select">
            <option value="">Select Activity Type</option>
            {% for activity_type in activity_types %}
            <option value="{{ activity_type.activity_type }}">{{ activity_type.activity_type }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <button class="btn btn-dark" id="searchButton">Search</button>
    </div>
</div>
<div class="row">
    <div class="col s12">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Activity Type</th>
                    <th>Activity Count</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentStatsTableBody">
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be populated by JavaScript -->
            </ul>
        </nav>
    </div>
</div>

<!-- Activity Detail Modal -->
<div class="modal fade" id="activityDetailModal" tabindex="-1" aria-labelledby="activityDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="activityDetailModalLabel">Activity Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Activity ID</th>
                            <th>Activity Type</th>
                            <th>Activity Date</th>
                            <th>Activity Detail</th>
                        </tr>
                    </thead>
                    <tbody id="activityDetailTableBody">
                        <!-- 动态填充活动详情 -->
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const perPage = 10;

        document.getElementById('searchButton').addEventListener('click', function() {
            var searchTerm = document.getElementById('searchInput').value;
            var activityType = document.getElementById('activityTypeSelect').value;
            fetch(`{{ url_for('search_student') }}?search_term=${searchTerm}&activity_type=${activityType}`)
                .then(response => response.json())
                .then(data => {
                    updateTableAndPagination(data.data);
                });
        });

        function loadStudentStats() {
            fetch(`{{ url_for('teacher_student') }}`)
                .then(response => response.json())
                .then(data => {
                    updateTableAndPagination(data);
                });
        }

        function updateTableAndPagination(data) {
            var tableBody = document.getElementById('studentStatsTableBody');
            tableBody.innerHTML = '';
            var totalPages = Math.ceil(data.length / perPage);
            var currentPage = 1;

            function renderTable(page) {
                tableBody.innerHTML = '';
                var start = (page - 1) * perPage;
                var end = start + perPage;
                var pageData = data.slice(start, end);

                pageData.forEach(function(item) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.student_id}</td>
                        <td>${item.activity_type}</td>
                        <td>${item.activity_count}</td>
                        <td><button class="btn btn-primary btn-sm view-details" data-student-id="${item.student_id}" data-activity-type="${item.activity_type}">View Details</button></td>
                    `;
                    tableBody.appendChild(tr);
                });

                // 添加查看详情按钮的点击事件
                var viewDetailButtons = tableBody.querySelectorAll('.view-details');
                viewDetailButtons.forEach(function(button) {
                    button.addEventListener('click', function() {
                        var studentId = this.getAttribute('data-student-id');
                        var activityType = this.getAttribute('data-activity-type');
                        fetchActivityDetails(studentId, activityType);
                    });
                });
            }

            function renderPagination() {
                var pagination = document.getElementById('pagination');
                pagination.innerHTML = '';

                for (var i = 1; i <= totalPages; i++) {
                    var li = document.createElement('li');
                    li.classList.add('page-item');
                    if (i === currentPage) {
                        li.classList.add('active');
                    }
                    li.innerHTML = `<a class="page-link" href="#" data-page="${i}">${i}</a>`;
                    pagination.appendChild(li);
                }

                var pageLinks = pagination.querySelectorAll('.page-link');
                pageLinks.forEach(function(link) {
                    link.addEventListener('click', function(event) {
                        event.preventDefault();
                        currentPage = parseInt(this.getAttribute('data-page'));
                        renderTable(currentPage);
                        renderPagination();
                    });
                });
            }

            renderTable(currentPage);
            renderPagination();
        }

        function fetchActivityDetails(studentId, activityType) {
            fetch(`/get_student_activity_details?student_id=${studentId}&activity_type=${activityType}`)
                .then(response => response.json())
                .then(data => {
                    var activityDetailTableBody = document.getElementById('activityDetailTableBody');
                    activityDetailTableBody.innerHTML = '';
                    data.activities.forEach(activity => {
                        var row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${activity.activity_id}</td>
                            <td>${activity.activity_type}</td>
                            <td>${activity.activity_date}</td>
                            <td>${activity.activity_detail}</td>
                        `;
                        activityDetailTableBody.appendChild(row);
                    });
                    new bootstrap.Modal(document.getElementById('activityDetailModal')).show();
                });
        }

        // Load initial data
        loadStudentStats();
    });
</script>
{% endblock %}
